<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Controle de material — forno</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EDE7D9; --surface:#FFFDF6; --surface-2:#E3DCC7;
    --text:#22261F; --text-dim:#635F4E;
    --accent:#B5601F; --accent-ink:#8C4914;
    --recolhido:#3F6E4C; --recolhido-bg:#E2ECDF;
    --alerta:#A5432A; --alerta-bg:#F3DFD5;
    --border:#C9BFA1; --border-strong:#A99C78;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1A1D18; --surface:#242822; --surface-2:#2C3128;
      --text:#EDEADE; --text-dim:#A5A190;
      --accent:#E1A24A; --accent-ink:#F0BE7A;
      --recolhido:#8FBB98; --recolhido-bg:#28352B;
      --alerta:#E08B6F; --alerta-bg:#3A2A24;
      --border:#3B4034; --border-strong:#4E5443;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1A1D18; --surface:#242822; --surface-2:#2C3128;
    --text:#EDEADE; --text-dim:#A5A190;
    --accent:#E1A24A; --accent-ink:#F0BE7A;
    --recolhido:#8FBB98; --recolhido-bg:#28352B;
    --alerta:#E08B6F; --alerta-bg:#3A2A24;
    --border:#3B4034; --border-strong:#4E5443;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;
    min-height:100vh; -webkit-tap-highlight-color:transparent;
  }
  .app{max-width:600px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-bottom:84px;}

  header.topbar{padding:22px 18px 16px;border-bottom:2px solid var(--border-strong);background:var(--surface);}
  .brandrow{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
  .brand h1{font-family:'Archivo',sans-serif;font-weight:800;font-size:1.3rem;letter-spacing:-0.01em;margin:0 0 4px;}
  .brand p{margin:0;font-size:0.78rem;color:var(--text-dim);}
  .tagmark{font-family:'Archivo',sans-serif;font-weight:800;font-size:0.66rem;border:1.5px solid var(--border-strong);border-radius:3px;padding:3px 7px;color:var(--text-dim);white-space:nowrap;transform:rotate(-2deg);}
  .stats{display:flex;gap:8px;margin-top:14px;}
  .stat{flex:1;border:1.5px dashed var(--border-strong);border-radius:8px;padding:8px 10px;background:var(--surface-2);}
  .stat .n{font-family:'Archivo',sans-serif;font-weight:800;font-size:1.3rem;line-height:1;}
  .stat .l{font-size:0.64rem;color:var(--text-dim);margin-top:3px;}
  .stat.ativo .n{color:var(--accent-ink);}
  .stat.recolhido .n{color:var(--recolhido);}

  main{flex:1;padding:16px 16px 8px;}
  section{display:none;} section.active{display:block;}
  h2.sectiontitle{font-family:'Archivo',sans-serif;font-size:1rem;font-weight:800;margin:2px 0 14px;}

  form.distform{background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:16px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:0.72rem;color:var(--text-dim);margin-bottom:5px;}
  .field input, .field select, .field textarea{width:100%;font-family:'IBM Plex Mono',monospace;font-size:0.92rem;padding:10px 11px;border:1.5px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);outline:none;}
  .field textarea{resize:vertical;min-height:90px;line-height:1.5;}
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--accent);}
  .field.row2{display:flex;gap:10px;} .field.row2>div{flex:1;}

  .preview{border:1.5px dashed var(--border-strong);border-radius:10px;padding:12px 14px;margin-bottom:14px;background:var(--surface-2);display:none;}
  .preview.show{display:block;}
  .preview h4{margin:0 0 8px;font-family:'Archivo',sans-serif;font-size:0.8rem;font-weight:700;color:var(--text-dim);}
  .previewlist{list-style:none;margin:0;padding:0;}
  .previewlist li{border-top:1px solid var(--border);padding:7px 0;}
  .previewlist li:first-child{border-top:none;}
  .previewlist label{display:flex;align-items:center;gap:10px;font-size:0.85rem;cursor:pointer;}
  .previewlist input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent);flex-shrink:0;}
  .previewlist .qty{font-family:'Archivo',sans-serif;font-weight:800;font-size:0.76rem;color:var(--accent-ink);min-width:26px;display:inline-block;}
  .previewlist li.off label{color:var(--text-dim);text-decoration:line-through;}

  button.primary{width:100%;font-family:'Archivo',sans-serif;font-weight:800;font-size:0.92rem;padding:13px;border:none;border-radius:8px;background:var(--accent);color:var(--surface);cursor:pointer;}
  button.primary:disabled{opacity:0.5;}

  .empty{text-align:center;color:var(--text-dim);font-size:0.85rem;padding:40px 20px;border:1.5px dashed var(--border-strong);border-radius:12px;}

  .card{background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:14px 15px;margin-bottom:12px;}
  .card .rowtop{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .card h3{font-family:'Archivo',sans-serif;font-size:1.02rem;font-weight:800;margin:0;}
  .card h3 .fornoNum{color:var(--accent-ink);}
  .badge{font-size:0.62rem;font-weight:600;padding:3px 8px;border-radius:20px;white-space:nowrap;}
  .badge.ativo{background:var(--alerta-bg);color:var(--alerta);}
  .badge.recolhido{background:var(--recolhido-bg);color:var(--recolhido);}
  .meta{margin-top:6px;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:0.78rem;color:var(--text-dim);}
  .meta strong{color:var(--text);font-weight:500;}

  .progress{margin:10px 0 4px;font-size:0.74rem;color:var(--text-dim);}
  .checklist{list-style:none;margin:6px 0 0;padding:0;}
  .checklist li{border-top:1px solid var(--border);padding:9px 0;}
  .checklist li:first-child{border-top:none;}
  .checklist .itemname{font-size:0.86rem;margin-bottom:6px;}
  .checklist .qty{font-family:'Archivo',sans-serif;font-weight:800;font-size:0.76rem;color:var(--accent-ink);min-width:26px;display:inline-block;}
  .checklist .flags{display:flex;gap:16px;}
  .checklist .flagchk{display:flex;align-items:center;gap:6px;font-size:0.76rem;color:var(--text-dim);cursor:pointer;}
  .checklist input[type=checkbox]{width:17px;height:17px;accent-color:var(--recolhido);flex-shrink:0;}
  .checklist li.partial .itemname{color:var(--accent-ink);}
  .checklist li.done .itemname{color:var(--text-dim);text-decoration:line-through;}
  .checklist li.done .qty{color:var(--recolhido);}

  .btnrow{margin-top:12px;display:flex;gap:8px;}
  .btn-collect{flex:1;font-family:'Archivo',sans-serif;font-size:0.8rem;font-weight:800;padding:9px 10px;border-radius:7px;border:none;background:var(--recolhido);color:var(--surface);cursor:pointer;}
  .btn-collect:disabled{opacity:0.5;}

  details.histcard summary{cursor:pointer;font-size:0.8rem;color:var(--accent-ink);margin-top:8px;}

  nav.tabs{position:fixed;bottom:0;left:0;right:0;max-width:600px;margin:0 auto;display:flex;background:var(--surface);border-top:2px solid var(--border-strong);padding-bottom:env(safe-area-inset-bottom);}
  nav.tabs button{flex:1;background:none;border:none;padding:11px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--text-dim);font-family:'IBM Plex Mono',monospace;font-size:0.68rem;cursor:pointer;}
  nav.tabs button svg{width:20px;height:20px;stroke:var(--text-dim);fill:none;stroke-width:1.8;}
  nav.tabs button.on{color:var(--accent-ink);} nav.tabs button.on svg{stroke:var(--accent-ink);}

  .banner{margin:0 0 14px;padding:10px 12px;border-radius:8px;background:var(--alerta-bg);color:var(--alerta);font-size:0.78rem;}
  .toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:0.78rem;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90%;text-align:center;z-index:50;}
  .toast.show{opacity:1;}
  ::placeholder{color:var(--text-dim);opacity:.6;}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brandrow">
      <div class="brand">
        <h1>Controle de material</h1>
        <p>Por forno e atividade</p>
      </div>
      <div class="tagmark">registros: <span id="regcount">0</span></div>
    </div>
    <div class="stats">
      <div class="stat ativo"><div class="n" id="statAtivo">0</div><div class="l">em campo</div></div>
      <div class="stat recolhido"><div class="n" id="statRecolhido">0</div><div class="l">concluídas</div></div>
    </div>
  </header>

  <main>
    <div id="dbBanner" class="banner" style="display:none;"></div>

    <section id="tab-distribuir" class="active">
      <h2 class="sectiontitle">Registrar saída</h2>
      <form class="distform" id="form-distribuir">
        <div class="field row2">
          <div>
            <label for="f-forno">Número do forno</label>
            <input id="f-forno" type="text" placeholder="ex.: 114" required>
          </div>
          <div>
            <label for="f-atividade">Atividade</label>
            <select id="f-atividade" required>
              <option value="" disabled selected>Selecione</option>
              <option value="raspagem">Raspagem</option>
              <option value="retirada_anodo">Retirada de ânodo</option>
              <option value="catodo">Cátodo</option>
              <option value="outros">Outros</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="f-responsavel">Responsável</label>
          <input id="f-responsavel" type="text" placeholder="quem retirou" required>
        </div>
        <div class="preview" id="preview">
          <h4>Itens desta atividade — desmarque o que não for enviado hoje</h4>
          <ul class="previewlist" id="previewList"></ul>
        </div>
        <div class="field" id="outrosField" style="display:none;">
          <label for="f-outros">Materiais (um por linha, ex.: 2 baldes)</label>
          <textarea id="f-outros" rows="5" placeholder="ex.:&#10;2 baldes&#10;1 lona&#10;3 pares de luva"></textarea>
        </div>
        <button class="primary" type="submit">Registrar saída</button>
      </form>
    </section>

    <section id="tab-campo">
      <h2 class="sectiontitle">Em campo</h2>
      <div id="listaCampo"></div>
    </section>

    <section id="tab-historico">
      <h2 class="sectiontitle">Histórico</h2>
      <div id="listaHistorico"></div>
    </section>
  </main>

  <nav class="tabs">
    <button class="tabbtn on" data-tab="distribuir">
      <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
      Distribuir
    </button>
    <button class="tabbtn" data-tab="campo">
      <svg viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11.5A7 7 0 105 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.4"/></svg>
      Em campo
    </button>
    <button class="tabbtn" data-tab="historico">
      <svg viewBox="0 0 24 24"><path d="M4 12l5 5L20 6"/></svg>
      Histórico
    </button>
  </nav>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============ CONFIGURAÇÃO ============ */
// Cole aqui a URL do seu Apps Script (termina em /exec)
const API_URL = "https://script.google.com/macros/s/AKfycbxhznc5a6HjD5a6oWs61Sw9v2VlF4oOHJdfSiPw3k3kT5OkDLxUK5HpmGu5v9_A2xJi/exec";
/* ======================================= */

const ACTIVITIES = {
  raspagem: {
    label: 'Raspagem',
    items: [
      { nome: 'Cintas ou balancim para calante', qtd: 2 },
      { nome: 'Sargentos duplos', qtd: 2 },
      { nome: 'Sargentos simples', qtd: 2 },
      { nome: 'Catracas', qtd: 4 },
      { nome: 'Correntes grandes', qtd: 2 },
      { nome: 'Correntes pequenas', qtd: 2 },
      { nome: 'Chapas de proteção de pedra de canto', qtd: 4 },
      { nome: 'Chapas de cabeceiras (cubas quentes)', qtd: 2 },
      { nome: 'Escada', qtd: 1 },
      { nome: 'Placas de isolamento', qtd: 5 }
    ]
  },
  retirada_anodo: {
    label: 'Retirada de ânodo',
    items: [
      { nome: 'Cintas ou balancim para calante', qtd: 2 },
      { nome: 'Sargentos duplos', qtd: 2 },
      { nome: 'Sargentos simples', qtd: 2 },
      { nome: 'Catracas', qtd: 4 },
      { nome: 'Correntes grandes', qtd: 2 },
      { nome: 'Correntes pequenas', qtd: 2 },
      { nome: 'Chapas de proteção de pedra de canto', qtd: 4 },
      { nome: 'Chapas de cabeceiras (cubas quentes)', qtd: 2 },
      { nome: 'Escada', qtd: 1 },
      { nome: 'Placas de isolamento', qtd: 5 }
    ]
  },
  catodo: {
    label: 'Cátodo',
    items: [
      { nome: 'Suportes de porcas', qtd: 2 },
      { nome: 'Bancadas grandes', qtd: 2 },
      { nome: 'Bancadas médias', qtd: 2 },
      { nome: 'Bancadas pequenas', qtd: 2 },
      { nome: 'Máquinas MIG', qtd: 3 },
      { nome: 'Gaiolas de Argônio e Star Gold', qtd: 2 },
      { nome: 'Suporte de cabeçote', qtd: 2 },
      { nome: 'Isolamentos de aço', qtd: 5 }
    ]
  },
  outros: {
    label: 'Outros',
    items: []
  }
};

let allJobs = [];
let apiReady = API_URL && API_URL.indexOf('http') === 0;

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

function switchTab(name){
  document.querySelectorAll('section').forEach(s=>s.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  document.querySelectorAll('.tabbtn').forEach(b=>b.classList.toggle('on', b.dataset.tab===name));
}
document.querySelectorAll('.tabbtn').forEach(b=> b.addEventListener('click', ()=>switchTab(b.dataset.tab)));

function esc(s){ const d=document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }

function timeAgo(iso){
  if(!iso) return '';
  const min = Math.floor((Date.now()-new Date(iso).getTime())/60000);
  if(min<1) return 'agora há pouco';
  if(min<60) return 'há '+min+(min===1?' minuto':' minutos');
  const h = Math.floor(min/60);
  if(h<24) return 'há '+h+(h===1?' hora':' horas');
  const d = Math.floor(h/24);
  return 'há '+d+(d===1?' dia':' dias');
}

/* preview do checklist ao escolher a atividade */
document.getElementById('f-atividade').addEventListener('change', (e)=>{
  const key = e.target.value;
  const preview = document.getElementById('preview');
  const list = document.getElementById('previewList');
  const outrosField = document.getElementById('outrosField');
  const outrosInput = document.getElementById('f-outros');

  if(key === 'outros'){
    preview.classList.remove('show');
    outrosField.style.display = 'block';
    outrosInput.required = true;
    return;
  }
  outrosField.style.display = 'none';
  outrosInput.required = false;

  if(!key || !ACTIVITIES[key] || ACTIVITIES[key].items.length===0){ preview.classList.remove('show'); return; }
  list.innerHTML = ACTIVITIES[key].items.map((it,idx)=>`
    <li>
      <label>
        <input type="checkbox" checked data-previewidx="${idx}">
        <span class="qty">${it.qtd}x</span> ${esc(it.nome)}
      </label>
    </li>
  `).join('');
  preview.classList.add('show');
});

/* risca o item quando desmarcado, pra ficar visualmente claro que não vai hoje */
document.getElementById('previewList').addEventListener('change', (e)=>{
  const cb = e.target.closest('input[data-previewidx]');
  if(!cb) return;
  cb.closest('li').classList.toggle('off', !cb.checked);
});

/* transforma o texto livre (uma linha por item) em uma lista de itens com quantidade */
function parseFreeTextItems(texto){
  return texto.split('\n')
    .map(l=>l.trim())
    .filter(l=>l.length>0)
    .map(l=>{
      const m = l.match(/^(\d+)\s*[xX]?\s+(.*)$/);
      if(m){ return { nome: m[2].trim(), qtd: Number(m[1]), enviado: true, recolhido: false }; }
      return { nome: l, qtd: 1, enviado: true, recolhido: false };
    });
}

/* ---------- API helpers ---------- */
async function apiGet(){
  const res = await fetch(API_URL, { method:'GET' });
  return res.json();
}
async function apiPost(payload){
  const res = await fetch(API_URL, {
    method:'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  });
  return res.json();
}

/* ---------- render ---------- */
function render(){
  const ativos = allJobs.filter(j=>j.status==='ativo').sort((a,b)=> new Date(b.distribuidoEm)-new Date(a.distribuidoEm));
  const concluidos = allJobs.filter(j=>j.status==='concluido').sort((a,b)=> new Date(b.concluidoEm)-new Date(a.concluidoEm));

  document.getElementById('statAtivo').textContent = ativos.length;
  document.getElementById('statRecolhido').textContent = concluidos.length;
  document.getElementById('regcount').textContent = allJobs.length;

  const listaCampo = document.getElementById('listaCampo');
  if(ativos.length===0){
    listaCampo.innerHTML = '<div class="empty">Nenhuma atividade em campo ainda.<br>Registre uma saída na aba Distribuir.</div>';
  }else{
    listaCampo.innerHTML = ativos.map(j=>{
      const enviados = j.items.filter(it=>it.enviado).length;
      const recolhidos = j.items.filter(it=>it.recolhido).length;
      const total = j.items.length;
      return `
      <div class="card">
        <div class="rowtop">
          <h3>Forno <span class="fornoNum">${esc(j.forno)}</span> — ${esc((ACTIVITIES[j.atividade]||{}).label || j.atividade)}</h3>
          <span class="badge ativo">em campo</span>
        </div>
        <div class="meta">
          <span>resp.: <strong>${esc(j.responsavel)}</strong></span>
          <span>saiu ${timeAgo(j.distribuidoEm)}</span>
        </div>
        <div class="progress">${enviados}/${total} enviados · ${recolhidos}/${total} recolhidos</div>
        <ul class="checklist">
          ${j.items.map((it,idx)=>`
            <li class="${it.recolhido?'done':(it.enviado?'partial':'')}">
              <div class="itemname"><span class="qty">${it.qtd}x</span> ${esc(it.nome)}</div>
              <div class="flags">
                <label class="flagchk"><input type="checkbox" ${it.enviado?'checked':''} data-jobid="${j.id}" data-idx="${idx}" data-field="enviado"> Enviado</label>
                <label class="flagchk"><input type="checkbox" ${it.recolhido?'checked':''} data-jobid="${j.id}" data-idx="${idx}" data-field="recolhido"> Recolhido</label>
              </div>
            </li>
          `).join('')}
        </ul>
        <div class="btnrow">
          <button class="btn-collect" data-action="completeAll" data-id="${j.id}">Marcar tudo como enviado e recolhido</button>
        </div>
      </div>`;
    }).join('');
  }

  const listaHist = document.getElementById('listaHistorico');
  if(concluidos.length===0){
    listaHist.innerHTML = '<div class="empty">Nenhuma atividade concluída ainda.</div>';
  }else{
    listaHist.innerHTML = concluidos.map(j=>`
      <div class="card">
        <div class="rowtop">
          <h3>Forno <span class="fornoNum">${esc(j.forno)}</span> — ${esc((ACTIVITIES[j.atividade]||{}).label || j.atividade)}</h3>
          <span class="badge recolhido">concluída</span>
        </div>
        <div class="meta">
          <span>resp.: <strong>${esc(j.responsavel)}</strong></span>
        </div>
        <div class="meta">
          <span>saída: ${new Date(j.distribuidoEm).toLocaleString('pt-BR')}</span>
          <span>recolhido: ${j.concluidoEm ? new Date(j.concluidoEm).toLocaleString('pt-BR') : ''}</span>
        </div>
        <details class="histcard">
          <summary>ver checklist</summary>
          <ul class="checklist">
            ${j.items.map(it=>`<li class="done"><div class="itemname"><span class="qty">${it.qtd}x</span> ${esc(it.nome)}</div></li>`).join('')}
          </ul>
        </details>
      </div>
    `).join('');
  }
}

async function refresh(){
  if(!apiReady) return;
  try{
    allJobs = await apiGet();
    render();
    document.getElementById('dbBanner').style.display = 'none';
  }catch(err){
    document.getElementById('dbBanner').style.display = 'block';
    document.getElementById('dbBanner').textContent = 'Não foi possível conectar ao armazenamento. Verifique sua conexão.';
  }
}

document.getElementById('form-distribuir').addEventListener('submit', async (e)=>{
  e.preventDefault();
  if(!apiReady){ showToast('Configure a URL do Apps Script no arquivo do app.'); return; }
  const forno = document.getElementById('f-forno').value.trim();
  const atividadeKey = document.getElementById('f-atividade').value;
  const responsavel = document.getElementById('f-responsavel').value.trim();
  if(!forno || !atividadeKey || !responsavel) return;

  let items;
  if(atividadeKey === 'outros'){
    items = parseFreeTextItems(document.getElementById('f-outros').value);
    if(items.length === 0){ showToast('Descreva ao menos um material.'); return; }
  }else{
    const checks = document.querySelectorAll('#previewList input[data-previewidx]');
    items = ACTIVITIES[atividadeKey].items.map((it,idx)=>{
      const cb = checks[idx];
      return { nome: it.nome, qtd: it.qtd, enviado: cb ? cb.checked : true, recolhido: false };
    });
  }

  const btn = e.target.querySelector('button[type=submit]');
  btn.disabled = true; btn.textContent = 'Registrando...';
  try{
    await apiPost({ action:'create', forno, atividade: atividadeKey, responsavel, items });
    e.target.reset();
    document.getElementById('preview').classList.remove('show');
    document.getElementById('outrosField').style.display = 'none';
    document.getElementById('f-outros').required = false;
    showToast('Saída registrada.');
    switchTab('campo');
    await refresh();
  }catch(err){
    showToast('Não foi possível registrar. Tente novamente.');
  }finally{
    btn.disabled = false; btn.textContent = 'Registrar saída';
  }
});

document.addEventListener('change', async (e)=>{
  const cb = e.target.closest('input[type=checkbox][data-jobid]');
  if(!cb || !apiReady) return;
  cb.disabled = true;
  try{
    await apiPost({ action:'toggleItem', id: cb.dataset.jobid, index: Number(cb.dataset.idx), field: cb.dataset.field });
    await refresh();
  }catch(err){
    showToast('Não foi possível atualizar o item.');
    cb.disabled = false;
  }
});

document.addEventListener('click', async (e)=>{
  const btn = e.target.closest('button[data-action="completeAll"]');
  if(!btn || !apiReady) return;
  btn.disabled = true; btn.textContent = 'Registrando...';
  try{
    await apiPost({ action:'completeAll', id: btn.dataset.id });
    showToast('Atividade concluída — material recolhido.');
    await refresh();
  }catch(err){
    showToast('Não foi possível concluir. Tente novamente.');
    btn.disabled = false; btn.textContent = 'Marcar tudo como enviado e recolhido';
  }
});

if(!apiReady){
  document.getElementById('dbBanner').style.display = 'block';
  document.getElementById('dbBanner').textContent = 'Configure a URL do Apps Script no topo do arquivo (const API_URL) antes de publicar este app.';
}else{
  refresh();
  setInterval(refresh, 8000);
}
</script>
</body>
</html>
